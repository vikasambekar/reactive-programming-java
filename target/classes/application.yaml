server:
  port: 8089

spring:
  profiles:
    active: local

  application:
    name: reactive-programming

  r2dbc:
    pool:
      enable: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  main:
    web-application-type: reactive

logging:
  level:
    org.springframework.r2dbc: info