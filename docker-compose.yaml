version: "3.9"

networks:
  reactive-network:
    driver: bridge

volumes:
  pgdata:
  pgadmin-data:

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    networks:
      - reactive-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: REACTIVE_DB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s

  pgadmin4:
    image: dpage/pgadmin4
    container_name: pgadmin4
    networks:
      - reactive-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8091:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure

  reactive-app:
    image: reactive-app
    container_name: reactive-app
    networks:
      - reactive-network
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-db:5432/REACTIVE_DB
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    ports:
      - "8089:8089"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure